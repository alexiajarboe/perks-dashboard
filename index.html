<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Perks Dashboard</title>
<meta name="description" content="Free and discounted perks for students, grouped by category.">
<style>
  :root {
    --bg: #f7f7f5; --card: #ffffff; --text: #1d1d1b; --muted: #6b6b66;
    --line: #e6e5e0; --accent: #2f5bea; --accent-soft: #e9eefd;
    --free: #157347; --free-soft: #e3f4ea; --local: #a4520b; --local-soft: #fbeedd;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141414; --card: #1d1d1d; --text: #ededea; --muted: #9a9a94;
      --line: #2e2e2c; --accent: #8aa6ff; --accent-soft: #232c45;
      --free: #6fd39b; --free-soft: #17301f; --local: #f0a865; --local-soft: #3a2a18;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 32px 16px 64px; }
  header h1 { margin: 0 0 4px; font-size: 28px; letter-spacing: -0.02em; }
  header p { margin: 0; color: var(--muted); }

  .controls {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    padding: 16px 0 12px; margin-top: 16px; border-bottom: 1px solid var(--line);
  }
  .controls input {
    flex: 1 1 240px; min-width: 0; padding: 10px 12px; font: inherit; color: var(--text);
    background: var(--card); border: 1px solid var(--line); border-radius: 8px;
  }
  .controls input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button {
    font: inherit; padding: 9px 14px; border: 0; background: var(--card); color: var(--text); cursor: pointer;
  }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .count { color: var(--muted); font-size: 14px; width: 100%; }

  nav.cats { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0 8px; }
  nav.cats a {
    font-size: 13px; text-decoration: none; color: var(--accent); background: var(--accent-soft);
    padding: 4px 10px; border-radius: 999px;
  }

  section { margin-top: 32px; scroll-margin-top: 130px; }
  section h2 { font-size: 19px; margin: 0 0 12px; display: flex; gap: 8px; align-items: baseline; }
  section h2 span { color: var(--muted); font-size: 14px; font-weight: 400; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px;
    display: flex; flex-direction: column; gap: 6px;
  }
  .card h3 { margin: 0; font-size: 16px; }
  .provider { color: var(--muted); font-size: 13px; }
  .offer { margin: 2px 0; }
  .elig { color: var(--muted); font-size: 13px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 6px; align-items: center; }
  .tag { font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); }
  .tag.free { background: var(--free-soft); color: var(--free); }
  .tag.local { background: var(--local-soft); color: var(--local); }
  .card a.go { margin-left: auto; font-size: 13px; color: var(--accent); text-decoration: none; font-weight: 600; }
  .card a.go:hover { text-decoration: underline; }
  .status { padding: 40px 0; text-align: center; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Student Perks Dashboard</h1>
    <p>Free stuff and discounts you can get as a student, grouped by category.</p>
  </header>

  <div class="controls">
    <input id="search" type="search" placeholder="Search perks, e.g. &quot;GitHub&quot; or &quot;museum&quot;" aria-label="Search perks">
    <div class="seg" role="group" aria-label="Where">
      <button data-scope="all" aria-pressed="true">All</button>
      <button data-scope="national" aria-pressed="false">National</button>
      <button data-scope="san_diego" aria-pressed="false">San Diego</button>
    </div>
    <div class="count" id="count"></div>
  </div>

  <nav class="cats" id="cats"></nav>
  <main id="list"><div class="status">Loading perks…</div></main>
</div>

<script>
  // Supabase connection. The publishable key is designed to be public;
  // the database's row-level security decides what it can read.
  const SUPABASE_URL = "https://lkwarswrixuopvhzqwpl.supabase.co";
  const SUPABASE_KEY = "sb_publishable_bIWmS90ED9OTK3G698f2EA_0Cnv1ifL";

  let perks = [];
  let scope = "all";

  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const slug = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, "-");
  const safeLink = (u) => /^https?:\/\//i.test(u || "") ? u : null;

  async function load() {
    try {
      const res = await fetch(`${SUPABASE_URL}/rest/v1/perks?select=*&order=category,name`, {
        headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` },
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      perks = await res.json();
      render();
    } catch (err) {
      document.getElementById("list").innerHTML =
        `<div class="status">Couldn't load perks (${esc(err.message)}). Try refreshing.</div>`;
    }
  }

  function render() {
    const q = document.getElementById("search").value.trim().toLowerCase();
    const shown = perks.filter((p) =>
      (scope === "all" || p.scope === scope) &&
      (!q || [p.name, p.provider, p.offer, p.category, p.eligibility].join(" ").toLowerCase().includes(q))
    );

    const groups = {};
    for (const p of shown) (groups[p.category || "Other"] ||= []).push(p);
    const cats = Object.keys(groups).sort((a, b) => groups[b].length - groups[a].length || a.localeCompare(b));

    document.getElementById("count").textContent =
      `Showing ${shown.length} of ${perks.length} perks in ${cats.length} categories`;
    document.getElementById("cats").innerHTML =
      cats.map((c) => `<a href="#${slug(c)}">${esc(c)} (${groups[c].length})</a>`).join("");

    document.getElementById("list").innerHTML = cats.length ? cats.map((c) => `
      <section id="${slug(c)}">
        <h2>${esc(c)} <span>${groups[c].length}</span></h2>
        <div class="grid">${groups[c].map(card).join("")}</div>
      </section>`).join("") : `<div class="status">No perks match your search.</div>`;
  }

  function card(p) {
    const link = safeLink(p.link);
    const isFree = /^free$/i.test(p.cost || "");
    return `<article class="card">
      <h3>${esc(p.name)}</h3>
      ${p.provider && p.provider !== p.name ? `<div class="provider">${esc(p.provider)}</div>` : ""}
      <p class="offer">${esc(p.offer)}</p>
      ${p.eligibility ? `<div class="elig">Who: ${esc(p.eligibility)}</div>` : ""}
      <div class="tags">
        ${p.cost ? `<span class="tag ${isFree ? "free" : ""}">${esc(p.cost)}</span>` : ""}
        ${p.scope === "san_diego" ? `<span class="tag local">San Diego</span>` : ""}
        ${link ? `<a class="go" href="${esc(link)}" target="_blank" rel="noopener">Get it →</a>` : ""}
      </div>
    </article>`;
  }

  document.getElementById("search").addEventListener("input", render);
  document.querySelectorAll(".seg button").forEach((b) => b.addEventListener("click", () => {
    scope = b.dataset.scope;
    document.querySelectorAll(".seg button").forEach((x) => x.setAttribute("aria-pressed", x === b));
    render();
  }));

  load();
</script>
</body>
</html>
